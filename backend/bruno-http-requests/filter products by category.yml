info:
  name: filter products by category
  type: http
  seq: 2

http:
  method: GET
  url: http://localhost:8080/api/produtos?categoria=Informática
  params:
    - name: categoria
      value: Informática
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

info:
  name: add a new product
  type: http
  seq: 4

http:
  method: POST
  url: http://localhost:8080/api/produtos
  body:
    type: json
    data: |-
      {
        "nome": "Caderno",
        "descricao": "Caderno 100 folhas",
        "categoria": "Papelaria",
        "quantidade": 10,
        "estoqueMinimo": 3
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

<div class="app-shell">
  <header class="app-header">
    <div class="brand">
      <h1>StockFlow</h1>
    </div>
    <button class="btn btn-primary" type="button" (click)="startCreate()">Novo Produto</button>
  </header>

  @if (error()) {
  <div class="alert alert-error">{{ error() }}</div>
  }

  @if (success()) {
  <div class="alert alert-success">{{ success() }}</div>
  }

  <main class="app-main">
    <lista-produto-list
      [produtos]="produtosFiltrados()"
      [selectedId]="selectedProduto()?.id ?? null"
      [loading]="loading()"
      [filter]="filter()"
      (select)="selectProduto($event)"
      (filterChange)="changeFilter($event)"
      (create)="startCreate()"
      (refresh)="refreshProdutos()"
    />

    <app-produto-detail
      [produto]="selectedProduto()"
      [mode]="mode()"
      (save)="saveProduto($event)"
      (remove)="deleteProduto($event)"
      (edit)="startEdit()"
      (create)="startCreate()"
      (cancel)="cancelEdit()"
      (movimentar)="movimentarProduto($event)"
    />
  </main>
</div>
